<!DOCTYPE html>
<html lang="en">

<body>
  <h1>🐾 Petution Full System Functional Test Bot</h1>
  <p class="subtitle">Simulates a real veterinarian's daily workflow through every feature in the system.</p>
  <button id="runBtn" onclick="runAllTests()">▶ Run All Tests</button>
  <div class="summary-bar" id="summaryBar">
    <div class="summary-stat" style="color:#6ee7b7"><strong id="passCount">0</strong> Passed</div>
    <div class="summary-stat" style="color:#fca5a5"><strong id="failCount">0</strong> Failed</div>
    <div class="summary-stat" style="color:#fcd34d"><strong id="warnCount">0</strong> Warnings</div>
    <div class="summary-stat" style="color:#94a3b8"><strong id="totalCount">0</strong> Total</div>
  </div>
  <div id="results"></div>
  <div class="log-box" id="logBox"></div>

<script>
// =========================================================================
// PETUTION TEST BOT — Full End-to-End Functional Simulation
// Simulates: Login → Client → Pet → Visit → SOAP Note → Vaccine Passport
//            → Invoice → Expense → Product → Analytics → Team → Settings
//            → Workspace Management → Backup/Restore → Logout
// =========================================================================

const results = [];
let logLines = [];

function log(msg) {
  logLines.push(`[${new Date().toISOString().slice(11,19)}] ${msg}`);
  document.getElementById('logBox').textContent = logLines.join('\n');
}

function assert(testName, groupName, condition, detail = '') {
  const status = condition ? 'pass' : 'fail';
  results.push({ testName, groupName, status, detail });
  log(`${condition ? '✅' : '❌'} [${groupName}] ${testName} ${detail ? '— ' + detail : ''}`);
  return condition;
}

function warn(testName, groupName, detail = '') {
  results.push({ testName, groupName, status: 'warn', detail });
  log(`⚠️ [${groupName}] ${testName} ${detail ? '— ' + detail : ''}`);
}

// ---- SIMULATED LOCALSTORAGE STATE ENGINE ----
// We test by directly manipulating the same localStorage keys the app uses.

function clearAllPetutionData() {
  const keys = [
    'petution_clients', 'petution_pets', 'petution_visits', 'petution_products',
    'petution_invoices', 'petution_expenses', 'petution_vaccines', 'petution_soap_notes',
    'petution_team', 'petution_settings', 'petution_workspaces', 'petution_active_ws',
    'petution_stocklogs', 'petution_notifications', 'petution_invitations', 'petution_user'
  ];
  keys.forEach(k => localStorage.removeItem(k));
  log('🧹 Cleared all petution_* localStorage keys');
}

function getStore(key) {
  try { return JSON.parse(localStorage.getItem(key) || '[]'); }
  catch { return []; }
}

function setStore(key, data) {
  localStorage.setItem(key, JSON.stringify(data));
}

// =========================================================================
// TEST GROUPS
// =========================================================================

function testAuth() {
  const G = 'Authentication';
  log('\n━━━ 🔐 PHASE 1: AUTHENTICATION ━━━');

  // Test 1: No user → unauthenticated
  localStorage.removeItem('petution_user');
  const noUser = localStorage.getItem('petution_user');
  assert('No stored user means unauthenticated', G, noUser === null);

  // Test 2: Email login
  const emailUser = {
    id: `usr-${Date.now()}`,
    name: 'dr khaled elgendy',
    email: 'khaledahmed94.ka@gmail.com',
    role: 'Owner',
    provider: 'email',
    isAuthenticated: true
  };
  setStore('petution_user', emailUser);
  const stored = JSON.parse(localStorage.getItem('petution_user'));
  assert('Email login creates authenticated user', G, stored.isAuthenticated === true, `name="${stored.name}"`);
  assert('Email login stores correct email', G, stored.email === 'khaledahmed94.ka@gmail.com');
  assert('Email login sets role to Owner', G, stored.role === 'Owner');
  assert('Email login sets provider to email', G, stored.provider === 'email');

  // Test 3: Google provider login
  const googleUser = {
    id: `usr-${Date.now() + 1}`,
    name: 'Dr. Khaled ElGendy (Google)',
    email: 'khaledahmed94.ka@gmail.com',
    role: 'Owner',
    provider: 'google',
    isAuthenticated: true
  };
  setStore('petution_user', googleUser);
  const gUser = JSON.parse(localStorage.getItem('petution_user'));
  assert('Google provider login works', G, gUser.provider === 'google' && gUser.isAuthenticated === true);

  // Test 4: Apple provider login
  const appleUser = {
    id: `usr-${Date.now() + 2}`,
    name: 'Dr. Khaled ElGendy (Apple)',
    email: 'khaled.elgendy@icloud.com',
    role: 'Owner',
    provider: 'apple',
    isAuthenticated: true
  };
  setStore('petution_user', appleUser);
  const aUser = JSON.parse(localStorage.getItem('petution_user'));
  assert('Apple provider login works', G, aUser.provider === 'apple');

  // Test 5: Signup
  const signupUser = {
    id: `usr-${Date.now() + 3}`,
    name: 'Dr. New Vet',
    email: 'newvet@petution.com',
    role: 'Owner',
    provider: 'email',
    isAuthenticated: true
  };
  setStore('petution_user', signupUser);
  assert('Signup creates authenticated user', G, JSON.parse(localStorage.getItem('petution_user')).isAuthenticated);

  // Test 6: Logout
  const loggedOut = { ...signupUser, isAuthenticated: false };
  setStore('petution_user', loggedOut);
  assert('Logout sets isAuthenticated to false', G, !JSON.parse(localStorage.getItem('petution_user')).isAuthenticated);

  // Re-login for remaining tests
  setStore('petution_user', emailUser);
}

  };

  setStore('petution_active_ws', ws1.id);
  const workspaces = getStore('petution_workspaces');
  assert('Register new clinic workspace', G, workspaces.length === 1, `name="${ws1.clinicName}"`);
  assert('Active workspace ID stored', G, localStorage.getItem('petution_active_ws') === JSON.stringify(ws1.id));

  // Test: Add second workspace
  const ws2 = { id: `ws-${Date.now() + 1}`, clinicName: 'Cairo Pet Hospital', ownerName: 'Dr. Sarah', email: 'sarah@vet.com', phone: '+201119876543', createdAt: '2026-07-25' };

  setStore('petution_active_ws', ws2.id);

  // Test: Delete workspace
  setStore('petution_workspaces', [ws1]);
  setStore('petution_active_ws', ws1.id);
  assert('Delete workspace leaves one remaining', G, getStore('petution_workspaces').length === 1);

  assert('Product has name & SKU', G, stored[0].name === 'Feline Rabies Vaccine' && stored[0].sku === 'VAC-CAT-01');
  assert('Product has pricing (price/cost/revenue)', G, stored[0].pricePerUnit === 250 && stored[0].costPerUnit === 120 && stored[0].revenuePerUnit === 130);

function testAnalytics() {

function testDataIntegrity() {
  const G = 'Data Integrity';
  log('\n━━━ 🔗 PHASE 15: CROSS-MODULE DATA INTEGRITY ━━━');

  const clients = getStore('petution_clients');
  const pets = getStore('petution_pets');
  const visits = getStore('petution_visits');
  const invoices = getStore('petution_invoices');
  const soapNotes = getStore('petution_soap_notes');
  const vaccines = getStore('petution_vaccines');

  // Pet → Owner linkage
  const linkedPets = pets.filter(p => p.owners?.length > 0 && clients.some(c => p.owners.includes(c.id)));
  assert('All pets linked to valid owners', G, linkedPets.length === pets.length, `${linkedPets.length}/${pets.length}`);

  // Visit → Pet linkage
  const linkedVisits = visits.filter(v => pets.some(p => p.id === v.petId));
  assert('All visits linked to valid pets', G, linkedVisits.length === visits.length, `${linkedVisits.length}/${visits.length}`);

  // Invoice → Pet & Client linkage
  const linkedInvoices = invoices.filter(i => pets.some(p => p.id === i.petId) && clients.some(c => c.id === i.clientId));
  assert('All invoices linked to valid pets & clients', G, linkedInvoices.length === invoices.length, `${linkedInvoices.length}/${invoices.length}`);

  // SOAP → Visit linkage
  const linkedSoap = soapNotes.filter(s => visits.some(v => v.id === s.visitId));
  assert('All SOAP notes linked to valid visits', G, linkedSoap.length === soapNotes.length, `${linkedSoap.length}/${soapNotes.length}`);

  // Vaccine → Pet linkage
  const linkedVaccines = vaccines.filter(v => pets.some(p => p.id === v.petId));
  assert('All vaccines linked to valid pets', G, linkedVaccines.length === vaccines.length, `${linkedVaccines.length}/${vaccines.length}`);

  // No duplicate IDs
  const allIds = [...clients.map(c => c.id), ...pets.map(p => p.id), ...visits.map(v => v.id), ...invoices.map(i => i.id)];
  assert('No duplicate IDs across modules', G, new Set(allIds).size === allIds.length);
}

function renderResults() {
  const container = document.getElementById('results');
  const groups = {};
  results.forEach(r => {
    if (!groups[r.groupName]) groups[r.groupName] = [];
    groups[r.groupName].push(r);
  });

  let html = '';
  for (const [gName, tests] of Object.entries(groups)) {
    const passCount = tests.filter(t => t.status === 'pass').length;
    const failCount = tests.filter(t => t.status === 'fail').length;
    const icon = failCount > 0 ? '❌' : '✅';
    html += `<div class="test-group"><h2>${icon} ${gName} <span style="font-size:0.7rem;color:#94a3b8;font-weight:400">(${passCount}/${tests.length} passed)</span></h2>`;
    for (const t of tests) {
      const cls = t.status === 'pass' ? 'pass' : t.status === 'fail' ? 'fail' : 'warn';
      html += `<div class="test-row"><span class="test-name">${t.testName} ${t.detail ? '<span style="color:#64748b;font-size:0.7rem">(' + t.detail + ')</span>' : ''}</span><span class="badge ${cls}">${t.status.toUpperCase()}</span></div>`;
    }
    html += '</div>';
  }
  container.innerHTML = html;

  document.getElementById('passCount').textContent = results.filter(r => r.status === 'pass').length;
  document.getElementById('failCount').textContent = results.filter(r => r.status === 'fail').length;
  document.getElementById('warnCount').textContent = results.filter(r => r.status === 'warn').length;
  document.getElementById('totalCount').textContent = results.length;
}
